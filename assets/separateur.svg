<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060d"/><stop offset="1" stop-color="#0a1230"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fa9ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#7fd0ff"/>
      <stop offset="1" stop-color="#3fa9ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowP" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M0 12H1000" stroke="#1e3a8a" stroke-width="1"/>
  <rect x="-200" y="11" width="200" height="2" fill="url(#edge)" filter="url(#glow)">
    <animate attributeName="x" values="-200;1000" dur="3s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(500 12)"><rect x="-6" y="-6" width="12" height="12" transform="rotate(45)" fill="#0a1230" stroke="#7fd0ff" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></rect></g>
</svg>